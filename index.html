<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Port Killer</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f9;
      --panel: #ffffff;
      --ink: #172033;
      --muted: #667085;
      --line: #d9dee7;
      --accent: #146c5f;
      --danger: #c93434;
      --warn: #a15c00;
      --shadow: 0 18px 50px rgba(20, 29, 45, .08);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font: 14px/1.45 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 24px clamp(16px, 4vw, 48px) 14px;
    }

    h1 {
      margin: 0;
      font-size: clamp(26px, 4vw, 42px);
      letter-spacing: 0;
    }

    .subtitle {
      margin: 6px 0 0;
      color: var(--muted);
    }

    main {
      padding: 10px clamp(16px, 4vw, 48px) 40px;
    }

    .toolbar {
      display: grid;
      grid-template-columns: minmax(180px, 1fr) auto auto;
      gap: 10px;
      align-items: center;
      margin: 10px 0 16px;
    }

    input, select, button {
      height: 40px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      font: inherit;
    }

    input {
      width: 100%;
      padding: 0 12px;
    }

    select {
      padding: 0 10px;
    }

    button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-width: 104px;
      padding: 0 14px;
      cursor: pointer;
      font-weight: 650;
    }

    button.primary {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    button.danger {
      background: #fff;
      color: var(--danger);
      border-color: rgba(201, 52, 52, .35);
    }

    button.warn {
      color: var(--warn);
      border-color: rgba(161, 92, 0, .35);
    }

    button:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }

    .stat, .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .stat {
      padding: 14px 16px;
    }

    .stat b {
      display: block;
      font-size: 26px;
    }

    .stat span {
      color: var(--muted);
    }

    .panel {
      overflow: hidden;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: middle;
    }

    th {
      background: #eef1f5;
      color: #495366;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0;
    }

    tr:last-child td {
      border-bottom: 0;
    }

    .mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      border-radius: 999px;
      padding: 2px 9px;
      background: #edf7f4;
      color: #146c5f;
      font-weight: 700;
    }

    .muted {
      color: var(--muted);
    }

    .container-line {
      display: block;
      margin-top: 4px;
      color: #475467;
      font-size: 12px;
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .notice {
      min-height: 36px;
      margin: 12px 0;
      color: var(--muted);
    }

    .notice.error { color: var(--danger); }
    .notice.ok { color: var(--accent); }

    .empty {
      padding: 30px;
      text-align: center;
      color: var(--muted);
    }

    @media (max-width: 820px) {
      header {
        display: block;
      }

      .toolbar, .stats {
        grid-template-columns: 1fr;
      }

      table, thead, tbody, tr, th, td {
        display: block;
      }

      thead { display: none; }

      tr {
        border-bottom: 1px solid var(--line);
        padding: 10px 0;
      }

      td {
        border: 0;
        padding: 7px 14px;
      }

      td::before {
        content: attr(data-label);
        display: block;
        color: var(--muted);
        font-size: 12px;
        margin-bottom: 2px;
      }

      .actions {
        justify-content: flex-start;
      }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Port Killer</h1>
      <p class="subtitle">Inspect listening ports, kill processes, or stop Docker containers that own a port.</p>
    </div>
    <button class="primary" id="refreshBtn">Refresh</button>
  </header>

  <main>
    <section class="stats" aria-label="Overview">
      <div class="stat"><b id="portCount">0</b><span>Listening ports</span></div>
      <div class="stat"><b id="processCount">0</b><span>Processes with PIDs</span></div>
      <div class="stat"><b id="containerCount">0</b><span>Running containers</span></div>
    </section>

    <section class="toolbar" aria-label="Filters">
      <input id="searchInput" placeholder="Filter by port, process, PID, container...">
      <select id="protocolFilter" aria-label="Filter protocol">
        <option value="">All protocols</option>
        <option value="tcp">TCP</option>
        <option value="udp">UDP</option>
      </select>
      <select id="containerFilter" aria-label="Filter containers">
        <option value="">All services</option>
        <option value="container">With container</option>
        <option value="plain">Without container</option>
      </select>
    </section>

    <div class="notice" id="notice"></div>

    <section class="panel">
      <table>
        <thead>
          <tr>
            <th>Port</th>
            <th>Protocol</th>
            <th>Host</th>
            <th>Process</th>
            <th>Container</th>
            <th style="text-align:right">Actions</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
      <div class="empty" id="empty" hidden>No services match the current filters.</div>
    </section>
  </main>

  <script>
    const state = { listeners: [], containers: [] };
    const els = {
      tbody: document.querySelector("#tbody"),
      empty: document.querySelector("#empty"),
      notice: document.querySelector("#notice"),
      refreshBtn: document.querySelector("#refreshBtn"),
      searchInput: document.querySelector("#searchInput"),
      protocolFilter: document.querySelector("#protocolFilter"),
      containerFilter: document.querySelector("#containerFilter"),
      portCount: document.querySelector("#portCount"),
      processCount: document.querySelector("#processCount"),
      containerCount: document.querySelector("#containerCount")
    };

    function setNotice(message, type = "") {
      els.notice.textContent = message;
      els.notice.className = `notice ${type}`;
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[char]);
    }

    function matchesFilters(item) {
      const search = els.searchInput.value.trim().toLowerCase();
      const protocol = els.protocolFilter.value;
      const containerMode = els.containerFilter.value;
      const hasContainer = item.containers.length > 0;

      if (protocol && item.protocol !== protocol) return false;
      if (containerMode === "container" && !hasContainer) return false;
      if (containerMode === "plain" && hasContainer) return false;
      if (!search) return true;

      const haystack = [
        item.port,
        item.protocol,
        item.host,
        item.process,
        item.pid,
        ...item.containers.flatMap(container => [container.id, container.name, container.image, container.status])
      ].join(" ").toLowerCase();

      return haystack.includes(search);
    }

    function containerHtml(containers) {
      if (!containers.length) return '<span class="muted">-</span>';
      return containers.map(container => `
        <span class="container-line">
          <b>${escapeHtml(container.name)}</b>
          <span class="mono">${escapeHtml(container.id)}</span>
          · ${escapeHtml(container.image)}
        </span>
      `).join("");
    }

    function render() {
      const rows = state.listeners.filter(matchesFilters);
      const pidCount = new Set(state.listeners.filter(item => item.pid).map(item => item.pid)).size;

      els.portCount.textContent = new Set(state.listeners.map(item => item.port)).size;
      els.processCount.textContent = pidCount;
      els.containerCount.textContent = state.containers.length;
      els.empty.hidden = rows.length !== 0;

      els.tbody.innerHTML = rows.map(item => {
        const containers = item.containers || [];
        const stopButtons = containers.map(container => `
          <button class="warn" data-stop="${escapeHtml(container.id)}" data-name="${escapeHtml(container.name)}">Stop</button>
        `).join("");
        return `
          <tr>
            <td data-label="Port"><span class="pill mono">${escapeHtml(item.port)}</span></td>
            <td data-label="Protocol" class="mono">${escapeHtml(item.protocol.toUpperCase())}</td>
            <td data-label="Host" class="mono">${escapeHtml(item.host || "*")}</td>
            <td data-label="Process">
              ${item.pid ? `<b>${escapeHtml(item.process || "unknown")}</b><span class="container-line mono">PID ${escapeHtml(item.pid)}</span>` : '<span class="muted">PID is not visible. Try running the app with sudo or Administrator privileges.</span>'}
            </td>
            <td data-label="Container">${containerHtml(containers)}</td>
            <td data-label="Actions">
              <div class="actions">
                ${item.pid ? `<button class="danger" data-kill="${escapeHtml(item.pid)}" data-signal="SIGTERM">Kill</button><button class="danger" data-kill="${escapeHtml(item.pid)}" data-signal="SIGKILL">Kill -9</button>` : ""}
                ${stopButtons}
              </div>
            </td>
          </tr>
        `;
      }).join("");
    }

    async function load() {
      els.refreshBtn.disabled = true;
      setNotice("Scanning ports...");
      try {
        const response = await fetch("/api/listeners");
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "Could not scan ports");
        state.listeners = data.listeners || [];
        state.containers = data.containers || [];
        render();
        setNotice(`Updated at ${new Date().toLocaleTimeString()}.`, "ok");
      } catch (error) {
        setNotice(error.message, "error");
      } finally {
        els.refreshBtn.disabled = false;
      }
    }

    async function postJson(path, payload) {
      const response = await fetch(path, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || "Action failed");
      return data;
    }

    els.tbody.addEventListener("click", async event => {
      const killButton = event.target.closest("[data-kill]");
      const stopButton = event.target.closest("[data-stop]");
      if (!killButton && !stopButton) return;

      try {
        if (killButton) {
          const pid = Number(killButton.dataset.kill);
          const sig = killButton.dataset.signal;
          const label = sig === "SIGKILL" ? "kill -9" : "kill";
          if (!confirm(`Are you sure you want to ${label} PID ${pid}?`)) return;
          await postJson("/api/kill", { pid, signal: sig });
          setNotice(`Sent ${sig} to PID ${pid}.`, "ok");
        }

        if (stopButton) {
          const id = stopButton.dataset.stop;
          const name = stopButton.dataset.name || id;
          if (!confirm(`Are you sure you want to run docker stop for ${name}?`)) return;
          await postJson("/api/docker-stop", { id });
          setNotice(`Stopped container ${name}.`, "ok");
        }

        setTimeout(load, 500);
      } catch (error) {
        setNotice(error.message, "error");
      }
    });

    els.refreshBtn.addEventListener("click", load);
    els.searchInput.addEventListener("input", render);
    els.protocolFilter.addEventListener("change", render);
    els.containerFilter.addEventListener("change", render);

    load();
  </script>
</body>
</html>
